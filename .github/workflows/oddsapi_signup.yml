name: oddsapi-signup

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oddsapi-signup
  cancel-in-progress: false

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: fetch bot via API (checkout-free)
        run: |
          gh api "repos/${{ github.repository }}/contents/scripts/oddsapi_signup_bot.py?ref=main" --jq .content | base64 -d > bot.py
          wc -c bot.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: install playwright
        run: |
          pip install playwright >/dev/null 2>&1
          python3 -m playwright install --with-deps chromium >/dev/null 2>&1
          echo playwright ready
      - name: write qqmail creds (from secrets)
        run: |
          mkdir -p ~/.config/polymarket-sync
          echo '{"email":"${{ secrets.QQ_EMAIL }}","auth_code":"${{ secrets.QQ_IMAP_CODE }}","imap":"imap.qq.com:993","smtp":"smtp.qq.com:465"}' > ~/.config/polymarket-sync/qqmail_imap.json
      - name: run signup bot
        run: |
          set -x
          python3 bot.py 2>&1 | tee bot_output.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit artifacts via python api
        run: |
          python3 - <<'COMMITEOF'
          import base64, json, os, time, urllib.request
          tok = os.environ["GH_TOKEN"]
          R = "${{ github.repository }}"
          def put(path, local):
              content = base64.b64encode(open(local, "rb").read()).decode()
              body = {"message": "artifact " + os.path.basename(local),
                      "content": content, "branch": "main"}
              url = "https://api.github.com/repos/" + R + "/contents/" + path
              try:
                  req = urllib.request.Request(url + "?ref=main", headers={
                      "Authorization": "Bearer " + tok,
                      "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body["sha"] = json.loads(r.read().decode())["sha"]
              except Exception:
                  pass
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, method="PUT", headers={
                          "Authorization": "Bearer " + tok,
                          "Accept": "application/vnd.github+json",
                          "Content-Type": "application/json"},
                          data=json.dumps(body).encode())
                      urllib.request.urlopen(req, timeout=30)
                      print("committed", path)
                      return
                  except Exception as e:
                      print("retry", i, str(e)[:80])
                      time.sleep(3)
          for p in ("state/oddsapi_key.enc", "state/oddsapi_signup_report.json",
                    "bot_output.txt"):
              dst = p if p.startswith("state/") else "state/oddsapi_bot_output.txt"
              if os.path.exists(p):
                  put(dst, p)
          COMMITEOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

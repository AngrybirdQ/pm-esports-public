name: lol-template-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: LoL Match template format probe
        run: |
          python3 << 'PYEOF'
          import gzip, json, re, urllib.request, urllib.parse
          UA = "pm-esports-research/1.0 (github.com/AngrybirdQ)"
          def lp(game, page):
              url = f"https://liquipedia.net/{game}/api.php?" + urllib.parse.urlencode(
                  {"action": "parse", "page": page, "prop": "wikitext", "format": "json"})
              req = urllib.request.Request(url, headers={"User-Agent": UA,
                  "Accept": "application/json", "Accept-Encoding": "gzip"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      raw = r.read()
                      if raw[:2] == b"\x1f\x8b": raw = gzip.decompress(raw)
                      return 200, json.loads(raw)["parse"]["wikitext"]["*"]
              except Exception as e:
                  return 0, str(e)[:60]
          # 1) 从opensearch发现LoL真实页名
          for q in ("World Championship 2025", "LPL 2025", "LCK 2025"):
              url = f"https://liquipedia.net/leagueoflegends/api.php?" + urllib.parse.urlencode(
                  {"action": "opensearch", "search": q, "limit": 8, "format": "json"})
              req = urllib.request.Request(url, headers={"User-Agent": UA,
                  "Accept": "application/json", "Accept-Encoding": "gzip"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read()
                  if raw[:2] == b"\x1f\x8b": raw = gzip.decompress(raw)
                  names = json.loads(raw)[1]
              print(f"LoL '{q}':", names[:6], flush=True)
              time.sleep(2)
          # 2) 取Worlds 2025页面的Match模板样例
          st, wt = lp("leagueoflegends", "World_Championship/2025")
          print("Worlds 2025:", st, "size:", len(wt) if isinstance(wt, str) else wt, flush=True)
          if st == 200:
              i = wt.find("{{Match")
              while i >= 0 and wt[i:i+11] == "{{Matchlist":
                  i = wt.find("{{Match", i + 2)
              end = None
              depth = 0; k = i
              while k < len(wt) - 1:
                  if wt[k:k+2] == "{{": depth += 1; k += 2; continue
                  if wt[k:k+2] == "}}":
                      depth -= 1; k += 2
                      if depth == 0: end = k; break
                      continue
                  k += 1
              print("=== RAW LoL Match template ===", flush=True)
              print(wt[i:end][:1200], flush=True)
          PYEOF

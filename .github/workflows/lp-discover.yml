name: liquipedia-page-discovery

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Discover tournament page names via opensearch
        run: |
          python3 << 'PYEOF'
          import json, re, time, urllib.request, urllib.parse, gzip
          UA = "pm-esports-research/1.0 (github.com/AngrybirdQ)"
          def lp_search(game, q, limit=20):
              url = f"https://liquipedia.net/{game}/api.php?" + urllib.parse.urlencode(
                  {"action": "opensearch", "search": q, "limit": limit, "format": "json"})
              req = urllib.request.Request(url, headers={"User-Agent": UA,
                  "Accept": "application/json", "Accept-Encoding": "gzip"})
              for i in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=40) as r:
                          raw = r.read()
                          if raw[:2] == b"\x1f\x8b": raw = gzip.decompress(raw)
                          return json.loads(raw)[1]
                  except Exception as e:
                      time.sleep(8)
              return []
          QUERIES = {
            "counterstrike": ["ESL Pro League", "Intel Extreme Masters", "BLAST Premier",
                              "PGL Major", "ESL Challenger"],
            "leagueoflegends": ["World Championship", "Mid-Season Invitational",
                                "LPL Season", "LCK", "LEC Season"],
            "dota2": ["The International", "DreamLeague", "ESL One", "Dota Pro Circuit"],
            "valorant": ["VALORANT Champions", "VCT Masters", "VCT Champions"],
          }
          discovered = {}
          for game, qs in QUERIES.items():
              found = []
              for q in qs:
                  names = lp_search(game, q)
                  found += [n for n in names if "Archive" not in n]
                  print(f"{game} '{q}': {len(names)} hits", flush=True)
                  for n in names[:5]: print("   ", n, flush=True)
                  time.sleep(2.2)
              discovered[game] = sorted(set(found))
          json.dump(discovered, open("lp_pages.json", "w"), indent=1)
          total = sum(len(v) for v in discovered.values())
          print(f"TOTAL discovered pages: {total}", flush=True)
          PYEOF

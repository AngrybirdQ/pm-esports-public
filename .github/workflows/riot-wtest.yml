name: riot-via-worker-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test worker proxy to Riot
        run: |
          W="https://pinnacle-anchor.577813472.workers.dev"
          for u in "https://developer.riotgames.com/" "https://esports-api.lolesports.com/persisted/gw/getLeagues?hl=en-US" "https://signup.riotgames.com/"; do
            code=$(curl -s --max-time 25 -o /tmp/rt.out -w "%{http_code}" "$W/?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$u")")
            echo "$code ${#$(cat /tmp/rt.out)}B $u"
            head -c 120 /tmp/rt.out; echo
          done

name: daily-cloud-pack

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 1,13 * * *'   # UTC 01:41/13:41 = BJT 09:41/21:41

permissions:
  contents: write

concurrency:
  group: daily-cloud-pack

jobs:
  shibo-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: fetch probe via API
        run: gh api "repos/${{ github.repository }}/contents/scripts/shibo_probe.py?ref=main" --jq .content | base64 -d > p.py
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: python3 p.py
      - name: commit
        run: |
          for F in state/shibo_probe.json; do
            [ -f "$F" ] || continue
            SHA=$(gh api "repos/${{ github.repository }}/contents/$F?ref=main" --jq .sha 2>/dev/null || echo "")
            ARGS=(--method PUT "repos/${{ github.repository }}/contents/$F" -f message="probe $(date -u +%H:%MZ)" -f content="$(base64 -w0 $F)" -f branch=main)
            [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
            gh api "${ARGS[@]}" >/dev/null && echo ok $F
          done
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  backtest-farm:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      matrix: { days: [14, 30] }
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: 'data, scripts' }
      - name: sharp matrix (${{ matrix.days }}d)
        run: python3 scripts/cloud_research.py ${{ matrix.days }}
      - name: commit analysis (API)
        run: |
          python3 - <<'PYEOF'
          import base64, glob, json, os, time, urllib.request
          tok = os.environ["GH_TOKEN"]; R = os.environ["REPO"]
          def put(path, local):
              content = base64.b64encode(open(local, "rb").read()).decode()
              body = {"message": "farm " + os.path.basename(local),
                      "content": content, "branch": "main"}
              url = "https://api.github.com/repos/%s/contents/%s" % (R, path)
              try:
                  req = urllib.request.Request(url + "?ref=main", headers={
                      "Authorization": "Bearer " + tok,
                      "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body["sha"] = json.loads(r.read().decode())["sha"]
              except Exception:
                  pass
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, method="PUT", headers={
                          "Authorization": "Bearer " + tok,
                          "Accept": "application/vnd.github+json"},
                          data=json.dumps(body).encode())
                      urllib.request.urlopen(req, timeout=30)
                      print("committed", path); return
                  except Exception as e:
                      time.sleep(3)
          for f in glob.glob("analysis/*.json") + glob.glob("analysis/*.md"):
              put("analysis/" + os.path.basename(f), f)
          PYEOF
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'

  price-history-bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: 'data, scripts, state' }
      - name: bulk run (500 tokens)
        run: BUDGET=500 python3 scripts/price_history_backfill.py
      - name: commit history
        run: |
          for F in data/history/*.jsonl state/ph_done.json; do
            [ -f "$F" ] || continue
            P="$F"; SHA=$(gh api "repos/${{ github.repository }}/contents/$P?ref=main" --jq .sha 2>/dev/null || echo "")
            ARGS=(--method PUT "repos/${{ github.repository }}/contents/$P" -f message="ph-bulk $(basename $F)" -f content="$(base64 -w0 $F)" -f branch=main)
            [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
            gh api "${ARGS[@]}" >/dev/null 2>&1 && echo ok $F || true
          done
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

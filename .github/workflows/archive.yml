name: archive
on: workflow_dispatch   # 10-11: 已并入collect.yml节奏(时间闸), 独立触发致并发互砍, 仅手动
permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PINNACLE_KEY: ${{ secrets.PINNACLE_KEY }}
      PH_BUDGET_S: "1200"
    steps:
      - uses: actions/checkout@v4
      - name: archive sweep (stage1 event list)
        run: python3 scripts/archive_sweep.py || echo "archive failed"
      - name: archive backfill (stage2 token histories)
        run: python3 scripts/archive_backfill.py || echo "backfill failed"
      - name: odota stats
        run: python3 scripts/odota_stats.py || echo "odota failed"
      - name: commit
        run: |
          git config user.name "pm-esports-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if ! git diff --cached --quiet; then
            git commit -m "archive: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "push race (next run retries)"
          fi

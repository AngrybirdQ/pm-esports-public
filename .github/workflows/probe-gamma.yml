name: probe-gamma
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: resolution probe
        run: |
          curl -s "https://gamma-api.polymarket.com/markets?condition_ids=0xc288967f4bee42292b3c1516fe640c19d7805f8ed949bfcabf989b0eb5e70554,0x98c266979031b3ee6c87ea5b8b671be0e242e13f9be4c123ff2c21ef46ff62c3,0xcc8e6d7e8834541872c4ad476a1feb8e074d7c8d6c93804407efd2c154a4f281,0xebc95c2e" | python3 -c "
import json,sys
d = json.load(sys.stdin)
for m in d:
    print((m.get('question') or '')[:52], '| closed:', m.get('closed'), '| prices:', m.get('outcomePrices'))
"

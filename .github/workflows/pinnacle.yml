name: pinnacle-odds

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: pinnacle-odds
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: fetch pinnacle esports odds
        run: python3 scripts/pinnacle_odds.py
      - name: commit
        run: |
          git config user.name "pm-esports-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "pinnacle: $(date -u '+%H:%MZ')"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
          fi

name: lol-direct-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Direct parse of known-rich LoL pages
        run: |
          python3 << 'PYEOF'
          import gzip, json, re, time, urllib.request, urllib.parse
          UA = "pm-esports-research/1.0 (github.com/AngrybirdQ)"
          def wt(game, page):
              url = f"https://liquipedia.net/{game}/api.php?" + urllib.parse.urlencode(
                  {"action": "parse", "page": page, "prop": "wikitext", "format": "json"})
              for i in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA,
                          "Accept": "application/json", "Accept-Encoding": "gzip"})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          raw = r.read()
                          if raw[:2] == b"\x1f\x8b": raw = gzip.decompress(raw)
                          return json.loads(raw)["parse"]["wikitext"]["*"]
                  except urllib.error.HTTPError as e:
                      if e.code == 404: return None
                      time.sleep(20)
                  except Exception:
                      time.sleep(10)
              return None
          PAGES = ["World Championship/2025", "World Championship/2024", "World Championship/2023",
                   "LPL/2025/Split 1", "LPL/2025/Split 2", "LPL/2024/Split 1",
                   "LCK/2025", "LCK/2024/Summer", "MSI 2025", "MSI 2024"]
          for p in PAGES:
              w = wt("leagueoflegends", p)
              if not w:
                  print(f"{p}: 404/miss", flush=True); time.sleep(6); continue
              m2 = len(re.findall(r"\{\{Match2", w))
              m1 = len(re.findall(r"\{\{Match\s*[|{\n]", w))
              opps = len(re.findall(r"TeamOpponent\|", w))
              print(f"{p}: {len(w)//1024}KB Match2={m2} Match={m1} TeamOpponent={opps}", flush=True)
              if m2 or m1:
                  # dump第一个模板
                  i = w.find("{{Match2") if m2 else w.find("{{Match")
                  print("  HEAD:", w[i:i+400].replace("\n", " | ")[:380], flush=True)
              time.sleep(6)
          PYEOF

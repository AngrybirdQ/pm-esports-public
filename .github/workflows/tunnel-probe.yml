name: tunnel-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl tunnel via vars
        run: |
            set -x
            echo "TUNNEL_URL=${TUNNEL_URL}"
            curl -sS -m 20 -w "\nHTTP=%{http_code}\n" "$TUNNEL_URL/health" || echo CURL_FAIL
            curl -sS -m 20 -w "\nHTTP=%{http_code}\n" "$TUNNEL_URL/pin/meta" || echo CURL_FAIL
        env:
          TUNNEL_URL: ${{ vars.TUNNEL_URL }}

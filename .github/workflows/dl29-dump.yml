name: dl29-standings-dump

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump DreamLeague 29 standings wikitext
        run: |
          python3 << 'PYEOF'
          import gzip, json, re, time, urllib.request, urllib.parse
          UA = "pm-esports-research/1.0 (github.com/AngrybirdQ)"
          url = "https://liquipedia.net/dota2/api.php?" + urllib.parse.urlencode(
              {"action": "parse", "page": "DreamLeague/29", "prop": "wikitext", "format": "json"})
          for i in range(4):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA,
                      "Accept": "application/json", "Accept-Encoding": "gzip"})
                  with urllib.request.urlopen(req, timeout=50) as r:
                      raw = r.read()
                      if raw[:2] == b"\x1f\x8b": raw = gzip.decompress(raw)
                  wt = json.loads(raw)["parse"]["wikitext"]["*"]
                  break
              except Exception as e:
                  print("retry", i, str(e)[:40], flush=True); time.sleep(20)
          idx = wt.find("{{StandingsStart")
          if idx < 0: idx = wt.find("{{GroupTableStart")
          if idx < 0: idx = wt.find("standings", 0)
          print("=== standings segment ===", flush=True)
          print(re.sub(r"[ \t]+", " ", wt[idx:idx+2500]), flush=True)
          PYEOF

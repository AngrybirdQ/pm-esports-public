name: riot-alt-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Alternative LoL data endpoints
        run: |
          python3 << 'PYEOF'
          import json, time, urllib.request, urllib.error
          def get(url, extra=None, tries=2):
              h = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131",
                   "Accept": "application/json"}
              if extra: h.update(extra)
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=h)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      return e.code, ""
                  except Exception as ex:
                      if i < tries-1: time.sleep(4); continue
                      return 0, str(ex)[:50]
          # 1) lolesports.com 前端用的feed URL(带Referer可能通)
          st, d = get("https://esports-api.lolesports.com/persisted/gw/getLeagues?hl=en-US",
                      extra={"Origin": "https://lolesports.com", "Referer": "https://lolesports.com/"})
          print("leagues with origin:", st, len(d), flush=True)
          if st == 200:
              try:
                  lg = [l.get("slug") for l in json.loads(d).get("data",{}).get("leagues",[])][:12]
                  print("  leagues:", lg, flush=True)
              except Exception as e: print("  parse:", str(e)[:50], flush=True)
          time.sleep(3)
          # 2) Oracle's Elixir Google Sheets (CSV导出, 绕主站CF)
          # 已知发布历史: docs.google.com/spreadsheets (公开读无需登录)
          st2, d2 = get("https://docs.google.com/spreadsheets/d/1YxA0ZdWjW7-0_5mZmF9qx9OBEkt4CZ8xvQ1D_kdeER8/export?format=csv&gid=0")
          print("g-sheet test:", st2, len(d2), flush=True)
          # 3) legacy oracleelixir S3 (老命名再试一轮, 含2024)
          for fn in ("2024_LoL_esports_match_data_from_OraclesElixir_20241110.csv",
                     "2024_LoL_esports_match_data_from_OraclesElixir.csv"):
              st3, d3 = get(f"https://oracleselixir-downloadable-data-files.s3.us-west-2.amazonaws.com/{fn}",
                            extra={"Referer": "https://oracleselixir.com/"})
              if st3 == 200:
                  print(f"S3 FOUND: {fn} {len(d3)//1024}KB", flush=True)
                  open("/tmp/oe_sample.csv", "w").write(d3[:3000])
                  print("  head:", d3[:200].replace("\n", " | ")[:190], flush=True)
                  break
              else:
                  print(f"S3 {fn[:40]}: {st3}", flush=True)
          print("ALT PROBE DONE", flush=True)
          PYEOF

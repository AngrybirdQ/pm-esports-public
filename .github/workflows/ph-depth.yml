name: prices-history-depth

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retention window test
        run: |
          python3 << 'PYEOF'
          import json, time, urllib.request, urllib.parse
          from datetime import datetime, timezone

          def get(url, tries=3, timeout=40):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "pm-research/1.0"})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 503) and i < tries-1: time.sleep(10); continue
                      return e.code, ""
                  except Exception:
                      if i < tries-1: time.sleep(5); continue
                      return 0, ""

          def fmt(t):
              v = int(t)
              if v > 100000000000: v = v // 1000
              return datetime.fromtimestamp(v, tz=timezone.utc).strftime("%m-%d %H:%M")

          WINDOWS = [("2026-10-01","2026-10-08"), ("2026-09-20","2026-09-30"),
                     ("2026-09-01","2026-09-10"), ("2026-08-01","2026-08-10"),
                     ("2026-07-01","2026-07-10")]
          for lo, hi in WINDOWS:
              q = urllib.parse.urlencode({"closed": "true", "limit": 20, "tag_slug": "esports",
                  "end_date_min": lo + "T00:00:00Z", "end_date_max": hi + "T23:59:59Z"})
              st, body = get("https://gamma-api.polymarket.com/events?" + q)
              if st != 200 or not body:
                  print(lo, "gamma", st, flush=True); continue
              evs = json.loads(body)
              hit = 0
              for e in evs:
                  for mk in (e.get("markets") or [])[:2]:
                      qq = mk.get("question", "")
                      if " vs " not in qq: continue
                      try: tok = json.loads(mk.get("clobTokenIds", "[]"))[0]
                      except Exception: continue
                      st2, ph = get("https://clob.polymarket.com/prices-history?market=" + tok + "&interval=all&fidelity=10")
                      n = 0; rng = ""
                      if st2 == 200 and ph:
                          h = json.loads(ph).get("history") or []
                          n = len(h)
                          if h: rng = fmt(h[0]["t"]) + "~" + fmt(h[-1]["t"])
                      print(" ", lo[:10], qq[:40], "pts=" + str(n), rng, flush=True)
                      hit += 1
                      time.sleep(2.5)
                      if hit >= 3: break
                  if hit >= 3: break
              if hit == 0:
                  print(" ", lo[:10], "no vs-markets in", len(evs), "events", flush=True)
              time.sleep(2)
          print("DEPTH PROBE DONE", flush=True)
          PYEOF

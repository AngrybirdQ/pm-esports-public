name: prices-history-depth

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Test prices-history retention window
        run: |
          python3 << 'PYEOF'
          import json, time, urllib.request, urllib.parse
          UA = "pm-research/1.0"
          def get(url, tries=3, timeout=40):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 503) and i < tries-1: time.sleep(10); continue
                      return e.code, ""
                  except Exception as ex:
                      if i < tries-1: time.sleep(5); continue
                      return 0, str(ex)[:50]
          # 按关闭时间取电竞市场样本: 10月上旬 / 9月下旬 / 9月上旬 / 8月 / 7月
          WINDOWS = [
              ("2026-10-01", "2026-10-08"),
              ("2026-09-20", "2026-09-30"),
              ("2026-09-01", "2026-09-10"),
              ("2026-08-01", "2026-08-10"),
              ("2026-07-01", "2026-07-10"),
          ]
          for lo, hi in WINDOWS:
              q = urllib.parse.urlencode({"closed": "true", "limit": 20,
                  "tag_slug": "esports", "tag_id": "1",
                  "end_date_min": lo + "T00:00:00Z", "end_date_max": hi + "T23:59:59Z"})
              st, body = get("https://gamma-api.polymarket.com/events?" + q)
              if st != 200 or not body:
                  print(f"{lo}: gamma {st}", flush=True); continue
              evs = json.loads(body)
              # 找 vs 型比赛市场
              hit = 0
              for e in evs:
                  mk = (e.get("markets") or [{}])[0]
                  q_ = mk.get("question", "")
                  if " vs " not in q_ and not any(g in q_ for g in ("Counter", "LoL", "Dota")): continue
                  try: tok = json.loads(mk.get("clobTokenIds", "[]"))[0]
                  except Exception: continue
                  st2, ph = get(f"https://clob.polymarket.com/prices-history?market={tok}&interval=all&fidelity=10")
                  n = 0; rng = ""
                  if st2 == 200 and ph:
                      h = json.loads(ph).get("history") or []
                      n = len(h)
                      if h:
                      from datetime import datetime, timezone
                      f = lambda t: datetime.fromtimestamp(int(t)/1000 if int(t) > 1e11 else int(t), tz=timezone.utc).strftime("%m-%d %H:%M")
                      rng = f'{f(h[0]["t"])}~{f(h[-1]["t"])}'
                  print(f'  {lo[:10]} "{q_[:38]}" pts={n} {rng}', flush=True)
                  hit += 1
                  time.sleep(2.5)
                  if hit >= 3: break
              if hit == 0:
                  print(f"{lo}: no vs-markets in {len(evs)} events", flush=True)
              time.sleep(2)
          print("DEPTH PROBE DONE", flush=True)
          PYEOF

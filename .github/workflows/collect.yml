name: collect-polymarket-esports

on:
  schedule:
    - cron: '13,43 * * * *'   # UTC, redundancy only — the primary heartbeat is
                               # the LOCAL dispatcher (this repo's scheduled
                               # runs proved unreliable on the old private repo)
  workflow_dispatch: {}
  repository_dispatch:          # primary trigger: carries the tasking payload
    types: [collect]            # (watchlist + betmatch + mode) from CN

permissions:
  contents: write
  actions: read

# [10-21绞杀链修复] KV通道*/5 dispatch × cancel-in-progress=true = 10-20以来
# 100个run里98个被中途绞杀, commit job几乎从不执行(=日~460min黑窗根因)。
# 改false+decide自跳过: 活跃管线在场时新run快速空转退出, 不再互杀。
concurrency:
  group: collect-esports-v2
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
      skip: ${{ steps.m.outputs.skip }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 活跃管线检测: 已有本workflow的其他run在跑 → 本轮空转跳过
          # (配合cancel-in-progress=false, 旧管线得以完整跑完commit)
          ACTIVE=$(gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=30"             --jq "[.workflow_runs[] | select(.name == \"collect-polymarket-esports\" and .id != ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
          if [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "active pipeline in-flight ($ACTIVE) — skipping this run"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          MODE=tick
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            M=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('client_payload',{}).get('mode','tick'))" "$GITHUB_EVENT_PATH" 2>/dev/null || echo tick)
            [ -n "$M" ] && MODE="$M"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  # ── A2 长跑模式: live窗口下单job内部循环 ~100min×90s ≈ 2-3min级新鲜度,
  #    每轮独立commit(单写者无竞态); dispatcher见in_progress的longrun会避让
  longrun:
    if: needs.decide.outputs.mode == 'longrun' && needs.decide.outputs.skip != 'true'
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 10-24: 115→60, iterate挂死(实测67min零提交)黑窗上限减半
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PINNACLE_KEY: ${{ secrets.PINNACLE_KEY }}
      PH_BUDGET_S: "300"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 11-15: 全量clone已撑爆6/8min job超时(run4812实测), 浅克隆秒级
      - name: iterate (90s loop, ~100min budget)
        run: |
          git config user.name "pm-esports-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + 6000)); i=0
          while [ $SECONDS -lt $END ]; do
            i=$((i+1))
            echo "== longrun iter $i $(date -u '+%H:%M:%S') =="
            # 10-24看门狗: 每脚本timeout包装 — fetch挂死被杀, 本iter继续走到
            # git commit, 黑窗上限从~67min(实测)压到~3-5min(一个iter周期)
            timeout 240 python3 scripts/collect.py || echo "collect failed/killed (next iter retries)"
            if [ $((i % 15)) -eq 1 ]; then timeout 300 python3 scripts/lowfreq_sweep.py || true; fi
            if [ $((i % 15)) -eq 8 ]; then PH_BUDGET_S=300 timeout 330 python3 scripts/pinnacle_history_sweep.py || true; fi
            timeout 120 python3 scripts/pinnacle_anchor_collect.py || echo "pinnacle failed/killed (next iter retries)"
            timeout 60 python3 scripts/wecom_alert.py || echo "wecom failed/killed (next iter retries)"
            timeout 120 python3 scripts/collect_side.py || echo "side failed/killed (next iter retries)"
            if [ $((i % 15)) -eq 1 ]; then timeout 180 python3 scripts/twin_and_settle.py || echo 'twin failed/killed (next iter retries)'; fi
            git add -A data state
            if ! git diff --cached --quiet; then
              git commit -m "data: longrun $(date -u '+%Y-%m-%dT%H:%M:%SZ') iter$i"
              git pull --rebase --autostash origin main || true
              git push origin HEAD:main || echo "push race (next iter retries)"
            fi
            sleep 60
          done

  # ── A1 并行矩阵 (tick模式): snap→flow 依赖经artifact交接, side独立,
  #    commit单写者收口 — 四job并行, wall time ~1min
  snap:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 11-15: 8→15, checkout挂死实证(run4812)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 11-15: 全量clone已撑爆6/8min job超时(run4812实测), 浅克隆秒级
      - name: preflight (syntax+regex gate, 10-21事故根治)
        run: |
          python3 - << 'EOF'
          import ast, glob, re, sys
          bad = []
          for f in glob.glob('scripts/*.py'):
              src = open(f).read()
              try:
                  ast.parse(src)
              except SyntaxError as e:
                  bad.append('%s: %s' % (f, e)); continue
              for m in re.finditer(r're\.compile\(\s*r?(["\'])(.*?)\1', src):
                  try:
                      re.compile(m.group(2))
                  except re.error as e:
                      bad.append('%s regex: %s' % (f, e))
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          EOF
      - name: collect snapshots + markets.json
        run: |
          python3 scripts/collect.py --stage snap
          # 11-16瘦身: 只打包本轮touched文件。原path: data+state=整月目录,
          # snap artifact实测1.13GB; 白名单后≈MB级。相对路径不变(commit合并语义不变)。
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          git status --porcelain -- data state | awk '{print $NF}' | while read -r f; do
            [ -f "$f" ] && install -Dm644 "$f" "/tmp/stage/$f"
          done
          echo "staged: $(find /tmp/stage -type f | wc -l) files, $(du -sh /tmp/stage | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: pm-snap
          path: /tmp/stage
          retention-days: 1
          if-no-files-found: warn

  flow:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: snap
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 11-15: 14→30, run4813实证books/trades v2迁移后13min+前置步>pinn sweep只剩1min撞线
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 11-15: 全量clone已撑爆6/8min job超时(run4812实测), 浅克隆秒级
      - uses: actions/download-artifact@v4
        with: { name: pm-snap, path: . }
      - name: collect trades/books/anomalies (uses markets.json handoff)
        run: python3 scripts/collect.py --stage flow
      - name: wecom direct push
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/wecom_alert.py || echo "wecom failed (commit retries)"

      - name: pinnacle history sweep (short batch)
        env:
          PINNACLE_KEY: ${{ secrets.PINNACLE_KEY }}
          PH_BUDGET_S: "90"
        run: python3 scripts/pinnacle_history_sweep.py || echo "ph failed (next round)"
      - name: pinnacle anchor collect
        env:
          PINNACLE_KEY: ${{ secrets.PINNACLE_KEY }}
        run: python3 scripts/pinnacle_anchor_collect.py || echo "pinnacle failed (commit retries)"
      - name: stage touched files (11-16瘦身, 含download来的snap件=union)
        run: |
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          git status --porcelain -- data state | awk '{print $NF}' | while read -r f; do
            [ -f "$f" ] && install -Dm644 "$f" "/tmp/stage/$f"
          done
          echo "staged: $(find /tmp/stage -type f | wc -l) files, $(du -sh /tmp/stage | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: pm-flow
          path: /tmp/stage
          retention-days: 1
          if-no-files-found: warn

  side:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 11-15: 全量clone已撑爆6/8min job超时(run4812实测), 浅克隆秒级
      - name: collect side sources (Kalshi book / gated probes)
        run: python3 scripts/collect_side.py
      - name: stage touched files (11-16瘦身)
        run: |
          rm -rf /tmp/stage && mkdir -p /tmp/stage
          git status --porcelain -- data | awk '{print $NF}' | while read -r f; do
            [ -f "$f" ] && install -Dm644 "$f" "/tmp/stage/$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pm-side
          path: /tmp/stage
          retention-days: 1
          if-no-files-found: warn

  commit:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: [snap, flow]  # 11-15: side去耦合(run4815实证: upload-artifact挂死拖死commit; kalshi book旁链独立提交)
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 11-15: 12→20, download重试空间
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 11-15: 全量clone已撑爆6/8min job超时(run4812实测), 浅克隆秒级
      - name: download artifacts (each guarded)
        id: dl
        continue-on-error: true  # 11-15: artifact API间歇挂死(run4816 step5实证), 缺件不拖死commit; side可能无件
        run: |
          # 11-16碰撞修复(run43804811115日志实证): gh run download解压进工作区,
          # artifact内回写的历史日文件(如2026-11-10T00.anoms.jsonl)与checkout
          # 同名文件冲突("openat: file exists")→整个zip解压失败→静默零commit
          # (11-15T07:52Z起断供根因)。改为解压到全新临时目录再cp合并(覆盖语义)。
          rm -rf /tmp/af; mkdir -p /tmp/af/snap /tmp/af/flow /tmp/af/side
          echo "pm-snap:";   gh run download ${{ github.run_id }} -n pm-snap -D /tmp/af/snap && cp -a /tmp/af/snap/. . || echo "pm-snap missing"
          echo "pm-flow:";   gh run download ${{ github.run_id }} -n pm-flow -D /tmp/af/flow && cp -a /tmp/af/flow/. . || echo "pm-flow missing"
          echo "pm-side:";   gh run download ${{ github.run_id }} -n pm-side -D /tmp/af/side && cp -a /tmp/af/side/. . || echo "pm-side missing"
          echo "-- files touched by download --"
          find data -type f -mmin -45 2>/dev/null | head -20 || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: download retry (once)
        if: steps.dl.outcome == 'failure'
        run: |
          sleep 30
          mkdir -p /tmp/af/re-snap /tmp/af/re-flow /tmp/af/re-side
          gh run download ${{ github.run_id }} -n pm-snap -D /tmp/af/re-snap && cp -a /tmp/af/re-snap/. . || true
          gh run download ${{ github.run_id }} -n pm-flow -D /tmp/af/re-flow && cp -a /tmp/af/re-flow/. . || true
          gh run download ${{ github.run_id }} -n pm-side -D /tmp/af/re-side && cp -a /tmp/af/re-side/. . || true
        env:
          GH_TOKEN: ${{ github.token }}
      # 11-17容错化: 四步研究/守卫类脚本单步失败不再打断commit链
      # (twin scan的naive时间炸曾把全链打断半天, 09:41Z起零产出)。
      # 每步记id, 失败由下方digest步骤汇总推wecom; 数据照常commit。
      - name: twin scan + pm settlement backfill (gamma reachable)
        id: twin
        continue-on-error: true
        run: python3 scripts/twin_and_settle.py
      - name: arbitrage scan (pm x Kalshi + internal consistency)
        id: arb
        continue-on-error: true
        run: python3 scripts/arb_scan.py
      - name: pm price-history backfill (research fuel)
        id: phb
        continue-on-error: true
        run: python3 scripts/price_history_backfill.py
      - name: data integrity guard
        id: guard
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/data_guard.py
      - name: sensor sentinel (silent-death guard)
        id: sensor
        continue-on-error: true
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/sensor_sentinel.py
      - name: channel probe
        id: chan
        continue-on-error: true
        run: python3 scripts/channel_probe.py
      - name: digest step failures -> wecom
        if: steps.twin.outcome == 'failure' || steps.arb.outcome == 'failure' || steps.phb.outcome == 'failure' || steps.guard.outcome == 'failure' || steps.sensor.outcome == 'failure' || steps.chan.outcome == 'failure'
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          MSG="commit-job step failure: twin=${{ steps.twin.outcome }} arb=${{ steps.arb.outcome }} phb=${{ steps.phb.outcome }} guard=${{ steps.guard.outcome }} sensor=${{ steps.sensor.outcome }} chan=${{ steps.chan.outcome }} (run ${{ github.run_id }})"
          echo "STEP-FAILURES: $MSG"
          curl -s -X POST "$WECOM_WEBHOOK" -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"[pm-esports] $MSG\"}}" || echo "wecom push failed"
      - name: commit (single writer — no race)
        run: |
          git config user.name "pm-esports-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "data: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "push race - next run retries"
          fi

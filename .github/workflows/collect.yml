name: collect-polymarket-esports

on:
  schedule:
    - cron: '13,43 * * * *'   # UTC, redundancy only — the primary heartbeat is
                               # the LOCAL dispatcher (this repo's scheduled
                               # runs proved unreliable on the old private repo)
  workflow_dispatch: {}
  repository_dispatch:          # primary trigger: carries the tasking payload
    types: [collect]            # (watchlist + betmatch + mode) from CN

permissions:
  contents: write
  actions: read

# [10-21绞杀链修复] KV通道*/5 dispatch × cancel-in-progress=true = 10-20以来
# 100个run里98个被中途绞杀, commit job几乎从不执行(=日~460min黑窗根因)。
# 改false+decide自跳过: 活跃管线在场时新run快速空转退出, 不再互杀。
concurrency:
  group: collect-esports-v2
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
      skip: ${{ steps.m.outputs.skip }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 活跃管线检测: 已有本workflow的其他run在跑 → 本轮空转跳过
          # (配合cancel-in-progress=false, 旧管线得以完整跑完commit)
          ACTIVE=$(gh api "repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=30"             --jq "[.workflow_runs[] | select(.name == \"collect-polymarket-esports\" and .id != ${{ github.run_id }})] | length" 2>/dev/null || echo 0)
          if [ "${ACTIVE:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "active pipeline in-flight ($ACTIVE) — skipping this run"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          MODE=tick
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            M=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('client_payload',{}).get('mode','tick'))" "$GITHUB_EVENT_PATH" 2>/dev/null || echo tick)
            [ -n "$M" ] && MODE="$M"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  # ── A2 长跑模式: live窗口下单job内部循环 ~100min×90s ≈ 2-3min级新鲜度,
  #    每轮独立commit(单写者无竞态); dispatcher见in_progress的longrun会避让
  longrun:
    if: needs.decide.outputs.mode == 'longrun' && needs.decide.outputs.skip != 'true'
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PINNACLE_KEY: ${{ secrets.PINNACLE_KEY }}
      PH_BUDGET_S: "300"
    steps:
      - uses: actions/checkout@v4
      - name: iterate (90s loop, ~100min budget)
        run: |
          git config user.name "pm-esports-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + 6000)); i=0
          while [ $SECONDS -lt $END ]; do
            i=$((i+1))
            echo "== longrun iter $i $(date -u '+%H:%M:%S') =="
            python3 scripts/collect.py || echo "collect failed (next iter retries)"
            if [ $((i % 15)) -eq 1 ]; then python3 scripts/lowfreq_sweep.py || true; fi
            if [ $((i % 15)) -eq 8 ]; then PH_BUDGET_S=300 python3 scripts/pinnacle_history_sweep.py || true; fi
            python3 scripts/pinnacle_anchor_collect.py || echo "pinnacle failed (next iter retries)"
            python3 scripts/wecom_alert.py || echo "wecom failed (next iter retries)"
            python3 scripts/collect_side.py || echo "side failed (next iter retries)"
            if [ $((i % 15)) -eq 1 ]; then python3 scripts/twin_and_settle.py || echo 'twin failed (next iter retries)'; fi
            git add -A data state
            if ! git diff --cached --quiet; then
              git commit -m "data: longrun $(date -u '+%Y-%m-%dT%H:%M:%SZ') iter$i"
              git pull --rebase --autostash origin main || true
              git push origin HEAD:main || echo "push race (next iter retries)"
            fi
            sleep 60
          done

  # ── A1 并行矩阵 (tick模式): snap→flow 依赖经artifact交接, side独立,
  #    commit单写者收口 — 四job并行, wall time ~1min
  snap:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: preflight (syntax+regex gate, 10-21事故根治)
        run: |
          python3 - << 'EOF'
          import ast, glob, re, sys
          bad = []
          for f in glob.glob('scripts/*.py'):
              src = open(f).read()
              try:
                  ast.parse(src)
              except SyntaxError as e:
                  bad.append('%s: %s' % (f, e)); continue
              for m in re.finditer(r're\.compile\(\s*r?(["\'])(.*?)\1', src):
                  try:
                      re.compile(m.group(2))
                  except re.error as e:
                      bad.append('%s regex: %s' % (f, e))
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          EOF
      - name: collect snapshots + markets.json
        run: python3 scripts/collect.py --stage snap
      - uses: actions/upload-artifact@v4
        with:
          name: pm-snap
          path: |
            data
            state
          retention-days: 1
          if-no-files-found: warn

  flow:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: snap
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pm-snap, path: . }
      - name: collect trades/books/anomalies (uses markets.json handoff)
        run: python3 scripts/collect.py --stage flow
      - name: wecom direct push
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/wecom_alert.py || echo "wecom failed (commit retries)"

      - name: pinnacle history sweep (short batch)
        env:
          PINNACLE_KEY: ${{ secrets.PINNACLE_KEY }}
          PH_BUDGET_S: "90"
        run: python3 scripts/pinnacle_history_sweep.py || echo "ph failed (next round)"
      - name: pinnacle anchor collect
        env:
          PINNACLE_KEY: ${{ secrets.PINNACLE_KEY }}
        run: python3 scripts/pinnacle_anchor_collect.py || echo "pinnacle failed (commit retries)"
      - uses: actions/upload-artifact@v4
        with:
          name: pm-flow
          path: |
            data
            state/seen_anomalies.json
            state/last_run_report_flow.json
          retention-days: 1
          if-no-files-found: warn

  side:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: collect side sources (Kalshi book / gated probes)
        run: python3 scripts/collect_side.py
      - uses: actions/upload-artifact@v4
        with:
          name: pm-side
          path: data
          retention-days: 1
          if-no-files-found: warn

  commit:
    if: needs.decide.outputs.mode != 'longrun' && needs.decide.outputs.skip != 'true'
    needs: [snap, flow, side]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pm-snap, path: . }
      - uses: actions/download-artifact@v4
        with: { name: pm-flow, path: . }
      - uses: actions/download-artifact@v4
        with: { name: pm-side, path: . }
      - name: twin scan + pm settlement backfill (gamma reachable)
        run: python3 scripts/twin_and_settle.py
      - name: arbitrage scan (pm x Kalshi + internal consistency)
        run: python3 scripts/arb_scan.py
      - name: pm price-history backfill (research fuel)
        run: python3 scripts/price_history_backfill.py
      - name: data integrity guard
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/data_guard.py
      - name: sensor sentinel (silent-death guard)
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python3 scripts/sensor_sentinel.py
      - name: channel probe
        run: python3 scripts/channel_probe.py
      - name: commit (single writer — no race)
        run: |
          git config user.name "pm-esports-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "data: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || echo "push race - next run retries"
          fi

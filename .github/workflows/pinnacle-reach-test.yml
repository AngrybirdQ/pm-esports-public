name: pinnacle-reach-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Pinnacle esports cascade v3
        env:
          PIN_KEY: CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
        run: |
          echo "=== 1) sport 12 leagues ==="
          curl -sS --max-time 25 -H "User-Agent: $UA" -H "X-API-KEY: $PIN_KEY" \
            "https://guest.api.arcadia.pinnacle.com/0.1/sports/12/leagues?featured=false" -o /tmp/leagues.json
          echo "raw_head:"; head -c 700 /tmp/leagues.json; echo
          LID=$(jq -r 'if type=="array" then ([.[] | select(type=="object") | select((.eventCount // 0) > 0)][0].id // empty) else (.leagues // [] | [.[] | select((.eventCount // 0) > 0)][0].id // empty) end' /tmp/leagues.json 2>/dev/null)
          echo "picked_league=$LID"
          echo "=== 2) matchups of first active league ==="
          if [ -n "$LID" ]; then
            curl -sS --max-time 25 -H "User-Agent: $UA" -H "X-API-KEY: $PIN_KEY" \
              "https://guest.api.arcadia.pinnacle.com/0.1/leagues/$LID/matchups" -o /tmp/matchups.json
            echo "raw_head:"; head -c 500 /tmp/matchups.json; echo
            jq -r 'if type=="array" then .[] else .matchups[]? end | select(type=="object") | "\(.id)\t\(.startTime // "")\t\(try (.participants[0].name // "?") catch "?") vs \(try (.participants[1].name // "?") catch "?")\ttype=\(.type // "?")"' /tmp/matchups.json 2>/dev/null | head -8
            MID=$(jq -r 'if type=="array" then .[] else .matchups[]? end | select(type=="object" and .type=="matchup") | .id' /tmp/matchups.json 2>/dev/null | head -1)
            echo "picked_matchup=$MID"
            echo "=== 3) odds of first matchup ==="
            if [ -n "$MID" ]; then
              curl -sS --max-time 25 -H "User-Agent: $UA" -H "X-API-KEY: $PIN_KEY" \
                "https://guest.api.arcadia.pinnacle.com/0.1/matchups/$MID/markets/related/straight" -o /tmp/mk.json
              echo "markets raw_head:"; head -c 900 /tmp/mk.json; echo
            fi
          fi
          echo "=== PROBE DONE ==="

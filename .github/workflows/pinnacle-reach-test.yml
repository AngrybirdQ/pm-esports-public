name: pinnacle-reach-test

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe v5 identify leagues
        env:
          PIN_KEY: CmX2KcMrXuFmNg6YFbmTxE0y9CIrOi0R
          UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
        run: |
          for lid in 1928 2406 9355 2405 2408; do
            curl -sS --max-time 20 -H "User-Agent: $UA" -H "X-API-KEY: $PIN_KEY" \
              "https://guest.api.arcadia.pinnacle.com/0.1/leagues/$lid/matchups" -o /tmp/m.json
            echo "league=$lid $(jq -r 'if type=="array" then "items=\(length) leagueName=\([.[].league.name // ""][0]) sample=\([.[] | select(.type=="matchup") | "\(.participants[0].name) vs \(.participants[1].name)"][0] // "")" else "ERR:\(.title // "?")" end' /tmp/m.json 2>/dev/null)"
          done
          echo "=== PROBE DONE ==="
